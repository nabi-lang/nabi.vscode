# The grammars match nabi-syntax; the extension builds, packages, and
# starts nabils inside VS Code.
name: CI / Build and test the extension

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    uses: nabi-lang/.github/.github/workflows/reusable-dco.yml@v1.0.2

  # syntaxes/ must be nabi-syntax's grammars at the commit in nabi-syntax.rev.
  grammar:
    name: Check grammars against nabi-syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check grammars with sync-grammar.mjs
        run: node scripts/sync-grammar.mjs --check

  package:
    name: Package the extension
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Compile the extension
        run: npm run compile
      - name: Package the .vsix
        run: npm run package
      - name: List the .vsix contents
        run: npx vsce ls
      - name: Upload the vsix artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: "*.vsix"

  # VS Code with the extension on test/fixture, against a released nabils.
  test:
    name: Test in VS Code (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install Nabi from the test fixture pin
        uses: nabi-lang/.github/actions/install-nabi@v1.0.2
        with:
          pin: test/fixture/nabi.nabion
      - name: Install npm dependencies
        run: npm ci
      - name: Run the tests under xvfb (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Run the tests
        if: runner.os != 'Linux'
        run: npm test

  # The one required check (rulesets/main.json): passes when every job
  # passed or was skipped.
  ci-gate:
    name: CI gate
    needs: [dco, grammar, package, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case $r in
              success | skipped) ;;
              *)
                echo "::error::a gate job did not pass: $r"
                exit 1
                ;;
            esac
          done
